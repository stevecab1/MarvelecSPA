{% load static %}<!DOCTYPE html>
<html lang="es-CL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>{% block title %}MARVELEC SPA{% endblock %}</title>
    <meta name="description" content="Reporte y seguimiento de avance de obra eléctrica - MARVELEC SPA">

    <!-- PWA -->
    <link rel="manifest" href="{% url 'marvelec_app:manifest' %}">
    <meta name="theme-color" content="#3a288f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MARVELEC">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" sizes="96x96" href="{% static 'marvelec_app/icons/icon-96x96.png' %}">
    <link rel="apple-touch-icon" href="{% static 'marvelec_app/icons/icon-192x192.png' %}">

    <link rel="stylesheet" href="{% static 'marvelec_app/css/style.css' %}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}"
      data-sw-url="{% url 'marvelec_app:service_worker' %}"
      {% if user.is_authenticated %}
      data-auth="1"
      data-user-id="{{ user.id }}"
      data-url-estado-notif="{% url 'marvelec_app:notificaciones_estado' %}"
      data-url-leer-todas="{% url 'marvelec_app:notificaciones_leer_todas' %}"
      data-url-vapid="{% url 'marvelec_app:vapid_key' %}"
      data-url-suscribir="{% url 'marvelec_app:suscribir_push' %}"
      data-url-desuscribir="{% url 'marvelec_app:desuscribir_push' %}"
      data-url-precache="{% block precache %}{% endblock %}"
      {% endif %}>
    {% include "partials/iconos.html" %}

    <div class="toast-stack" id="toasts" aria-live="polite">
        {% for message in messages %}
        <template data-toast="{{ message.tags }}">{{ message }}</template>
        {% endfor %}
    </div>

    {% block layout %}{% block content %}{% endblock %}{% endblock %}

    <!-- Visor de fotos -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto">
        <button type="button" class="btn btn-ghost btn-icon lightbox-close" data-lightbox-close aria-label="Cerrar">
            <svg class="icon icon-lg"><use href="#i-x"></use></svg>
        </button>
        <img id="lightbox-img" src="" alt="">
        <div class="lightbox-bar">
            <span id="lightbox-text"></span>
            <a id="lightbox-download" href="" download class="btn btn-secondary btn-sm">
                <svg class="icon icon-sm"><use href="#i-download"></use></svg> Descargar
            </a>
        </div>
    </div>

    <script src="{% static 'marvelec_app/js/app.js' %}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
